# gh release create --generate-notes などで自動生成するリリースノートの分類
# PR に付いたラベルで分け、どれにも当てはまらない PR は Other Changes に入れる
changelog:
  categories:
    - title: ✨ New Features
      labels: [enhancement]
    - title: 🐛 Bug Fixes
      labels: [bug]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: 🔧 Other Changes
      labels: ['*']
